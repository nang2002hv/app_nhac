<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinaMusic - Đăng nhập</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            margin-bottom: 2rem;
        }

        .logo h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: #666;
            font-size: 0.9rem;
        }

        .login-form {
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
            margin-bottom: 1rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .divider {
            margin: 1.5rem 0;
            position: relative;
            text-align: center;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e1e5e9;
        }

        .divider span {
            background: white;
            padding: 0 1rem;
            color: #666;
            font-size: 0.9rem;
        }

        .google-login-btn {
            width: 100%;
            padding: 12px;
            background: white;
            color: #333;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .google-login-btn:hover {
            border-color: #4285f4;
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.2);
            transform: translateY(-2px);
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .signup-link {
            margin-top: 1.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Loading spinner */
        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Alert styles */
        .alert {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .alert.error {
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .alert.info {
            background-color: #d1ecf1;
            border: 1px solid #bee5eb;
            color: #0c5460;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-container {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1><i class="fas fa-music"></i> TinaMusic</h1>
            <p>Đăng nhập vào tài khoản của bạn</p>
        </div>

        <div id="alert" class="alert"></div>

        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required>
            </div>
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="login-btn">
                <span id="loginText">Đăng nhập</span>
                <div id="loginLoading" class="loading"></div>
            </button>
            <a href="#" class="forgot-password">Quên mật khẩu?</a>
        </form>

        <div class="divider">
            <span>hoặc</span>
        </div>

        <button class="google-login-btn" id="googleLoginBtn">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span id="googleText">Đăng nhập bằng Google</span>
            <div id="googleLoading" class="loading"></div>
        </button>

        <div class="signup-link">
            Chưa có tài khoản? <a href="#">Đăng ký ngay</a>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://localhost:8080/api/v1';
        
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const alert = document.getElementById('alert');
        const loginLoading = document.getElementById('loginLoading');
        const loginText = document.getElementById('loginText');
        const googleLoading = document.getElementById('googleLoading');
        const googleText = document.getElementById('googleText');

        // Utility functions
        function showAlert(message, type = 'error') {
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            
            // Auto hide after 5 seconds
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function setLoading(isLoading, button = 'login') {
            if (button === 'login') {
                loginLoading.style.display = isLoading ? 'inline-block' : 'none';
                loginText.style.display = isLoading ? 'none' : 'inline';
                loginForm.querySelector('button').disabled = isLoading;
            } else if (button === 'google') {
                googleLoading.style.display = isLoading ? 'inline-block' : 'none';
                googleText.style.display = isLoading ? 'none' : 'inline';
                googleLoginBtn.disabled = isLoading;
            }
        }

        // Regular login form handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            setLoading(true, 'login');
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showAlert('Đăng nhập thành công!', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    showAlert(data.message || 'Đăng nhập thất bại');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Có lỗi xảy ra khi đăng nhập');
            } finally {
                setLoading(false, 'login');
            }
        });

        // Google login handler
        googleLoginBtn.addEventListener('click', () => {
            setLoading(true, 'google');
            
            try {
                console.log('🚀 Bắt đầu Google OAuth flow...');
                
                // Frontend tự build Google OAuth URL
                const googleAuthUrl = buildGoogleAuthUrl();
                console.log('📋 Google Auth URL:', googleAuthUrl);
                
                // Store state for debugging
                sessionStorage.setItem('oauth_flow', 'google');
                sessionStorage.setItem('oauth_start_time', Date.now().toString());
                
                showAlert('Đang chuyển hướng đến Google...', 'info');
                
                // Redirect to Google OAuth
                setTimeout(() => {
                    window.location.href = googleAuthUrl;
                }, 1000);
                
            } catch (error) {
                console.error('Google login error:', error);
                showAlert('Có lỗi xảy ra khi đăng nhập bằng Google');
                setLoading(false, 'google');
            }
        });

        // Frontend tự build Google OAuth URL (không gọi backend)
        function buildGoogleAuthUrl() {
            console.log('🔨 Frontend tự build Google OAuth URL...');
            
            // OAuth config hardcoded trong frontend  
            const GOOGLE_CONFIG = {
                client_id: '693298612015-mg1bbgvm70v7b4v9bOnti4nhkfgafnb8.apps.googleusercontent.com',
                authorization_uri: 'https://accounts.google.com/o/oauth2/auth',
                redirect_uri: 'http://localhost:8080/api/v1/oauth/social',
                scope: 'profile email'
            };
            
            const state = generateRandomState();
            const params = new URLSearchParams({
                client_id: GOOGLE_CONFIG.client_id,
                redirect_uri: GOOGLE_CONFIG.redirect_uri,
                response_type: 'code',
                scope: GOOGLE_CONFIG.scope,
                access_type: 'offline',
                state: state,
                login_type: 'google'
            });
            
            const authUrl = `${GOOGLE_CONFIG.authorization_uri}?${params.toString()}`;
            
            console.log('✅ Frontend config:', GOOGLE_CONFIG);
            console.log('🔗 Authorization URL:', authUrl);
            console.log('🔗 Full redirect URI:', GOOGLE_CONFIG.redirect_uri);
            console.log('🌐 Current origin:', window.location.origin);
            
            return authUrl;
        }

        // Generate random state for CSRF protection
        function generateRandomState() {
            return Math.random().toString(36).substring(2, 15) + 
                   Math.random().toString(36).substring(2, 15);
        }

        // Handle OAuth callback (nhận authorization code từ Google)
        function handleOAuthCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            const error = urlParams.get('error');
            
            if (error) {
                console.error('❌ OAuth error:', error);
                showAlert(`Lỗi OAuth: ${error}`);
                return;
            }
            
            if (code) {
                console.log('✅ Nhận được authorization code từ Google:', code.substring(0, 10) + '...');
                console.log('📋 State:', state);
                
                // Gửi authorization code về backend để xử lý
                sendAuthorizationCodeToBackend(code);
            }
        }

        // Gửi authorization code về backend để xác thực và lấy thông tin user
        async function sendAuthorizationCodeToBackend(code) {
            setLoading(true, 'google');
            
            try {
                console.log('📤 Gửi authorization code đến backend...');
                
                // Gửi code đến backend qua endpoint /oauth/social
                const response = await fetch(`${API_BASE_URL}/oauth/social?code=${code}&login_type=google`, {
                    method: 'GET'
                });
                
                const data = await response.json();
                console.log('📥 Response từ backend:', data);
                
                if (data.success) {
                    showAlert('Đăng nhập thành công!', 'success');
                    
                    // Lưu thông tin user nếu có
                    if (data.data) {
                        console.log('👤 User info:', data.data);
                        localStorage.setItem('user', JSON.stringify(data.data));
                    }
                    
                    // Chuyển hướng đến trang chính
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1500);
                } else {
                    showAlert(data.message || 'Đăng nhập thất bại');
                }
                
            } catch (error) {
                console.error('❌ Authentication error:', error);
                showAlert('Có lỗi xảy ra khi xử lý đăng nhập');
            } finally {
                setLoading(false, 'google');
                // Xóa code khỏi URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // Check for OAuth callback on page load
        window.addEventListener('load', () => {
            handleOAuthCallback();
        });

        // Demo info
        console.log('🎵 TinaMusic OAuth Flow');
        console.log('🔧 Frontend tự build OAuth URL, chỉ gửi authorization code về backend');
        console.log('📡 Backend endpoint:', `${API_BASE_URL}/oauth/social`);
        console.log('🔐 Flow: Frontend → Google OAuth → Authorization Code → Backend');
    </script>
</body>
</html>
